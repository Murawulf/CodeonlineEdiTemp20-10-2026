<VirtualHost *:80>
    ServerName dev.codeonline-edi.net
    ServerAdmin webmaster@codeonline-edi.net
    DocumentRoot /var/www/codeonline-edi/dist

    # Redirection HTTP vers HTTPS (décommenter si SSL activé)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/codeonline-edi-error.log
    CustomLog ${APACHE_LOG_DIR}/codeonline-edi-access.log combined

    # Configuration du répertoire Frontend
    <Directory /var/www/codeonline-edi/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Fallback pour React Router (SPA)
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-l
        RewriteRule . /index.html [L]
    </Directory>

    # Proxy pour l'API Backend (Node.js sur port 5001)
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    <Location /api/>
        ProxyPass http://localhost:5001/api/
        ProxyPassReverse http://localhost:5001/api/
    </Location>

    # Proxy pour Socket.IO (WebSocket)
    <Location /socket.io/>
        ProxyPass http://localhost:5001/socket.io/
        ProxyPassReverse http://localhost:5001/socket.io/
        
        # Support WebSocket
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule /(.*)           ws://localhost:5001/socket.io/$1 [P,L]
    </Location>

    # Alias pour les uploads et fichiers statiques du backend
    Alias /uploads /var/www/Edi-dev/uploads
    <Directory /var/www/Edi-dev/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "max-age=2592000, public"
    </Directory>

    Alias /modeles /var/www/Edi-dev/Modeles
    <Directory /var/www/Edi-dev/Modeles>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

