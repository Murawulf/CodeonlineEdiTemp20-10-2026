# Document d'Architecture Technique Détaillé — Codeonline-InfoTn (EDI Platform)

**Version** : 2.0  
**Date** : 19 Mars 2026  
**Auteur** : Architecture Technique  
**Statut** : Production  

---

## 1. Vue d'ensemble du système

### 1.1 Objectif

Codeonline-InfoTn est une **plateforme d'Échange de Données Informatisées (EDI)** conforme aux standards **GS1/EANCOM** pour la gestion des flux commerciaux B2B entre partenaires internationaux. Le système permet l'échange sécurisé de documents commerciaux (commandes, factures, avis d'expédition, réponses de commande) entre des nœuds géographiquement distribués (Tunisie, Sénégal, France, etc.).

### 1.2 Caractéristiques Principales

- **Multi-nœuds distribués** : Chaque pays/entité opère un nœud autonome avec sa propre base de données.
- **Chiffrement de bout en bout (E2EE)** : Hybride AES-256-GCM + RSA-2048-OAEP avec signature numérique.
- **Communication résiliente** : Stratégie Orchestrateur-first avec fallback P2P automatique.
- **Multi-entités** : Un même serveur peut gérer plusieurs entités avec des GLN distincts.
- **Standards GS1** : Conformité EANCOM pour ORDERS, ORDRSP, DESADV, INVOIC.
- **Audit et traçabilité** : Journalisation complète de chaque transmission avec synchronisation différée.

### 1.3 Nœuds Déployés

| Nœud | Serveur | GLN | Port |
|------|---------|-----|------|
| Tunisie | 217.182.94.86 | 6191907700002 | 5001 |
| Sénégal | 91.134.35.126 | SN02583102G4 | 5001 |
| Orchestrateur (Hub) | edi-dev.codeonline-info.com | — | 443 (HTTPS) |

### 2.2 Pattern Architectural

Le système suit un **Monolith Modulaire** avec :
- **server.js** comme point d'entrée unique (~10 000 lignes) contenant les routes API et la logique métier.
- **Services découplés** pour la cryptographie, la communication et la configuration.
- **Worker asynchrone** pour le traitement des transmissions EDI.
- **Couche d'abstraction DB** pour supporter MySQL (production) et SQLite (développement/test).

## 7. Worker EDI asynchrone

Le worker tourne en arrière-plan et traite les transmissions EDI de manière asynchrone via des intervalles configurables.

**3 cycles de traitement** :

| Cycle | Intervalle | Batch | Description |
|-------|-----------|-------|-------------|
| **Outbound** | 30s | 10 msg | Envoie les messages PENDING/ERROR |
| **Inbound** | 45s | 10 msg | Parse et traite les messages RECEIVED |
| **Cleanup** | 1h | — | Supprime les transmissions anciennes |

## 1. server.js — Architecture et Refactoring

### 1.1 Vue d'ensemble

`server.js` est le **point d'entrée monolithique** (~10 100 lignes) du backend. Il contient :
- Imports et configuration (~100 lignes)
- Middleware Express (logging, CORS, static files) (~330 lignes)
- Connexions DB (MySQL + SQLite) (~600 lignes)
- **168 endpoints REST** organisés par domaine métier
- WebSocket server (socket.io)
- Séquence de démarrage avec initialisation des services

### 1.2 Refactoring effectué

**Avant** : Les transmissions EDI utilisaient un `MY_GLN` hardcodé et les clés cryptographiques étaient gérées manuellement via des fichiers.

**Après** :
1. **Dynamic sender_gln** : Chaque transmission stocke le GLN de l'émetteur, permettant le multi-entités.
2. **Orchestrator-based key management** : Les clés publiques sont publiées/récupérées automatiquement via l'Orchestrateur.
3. **DB-backed key cache** : Table `network_directory` pour cache local des clés partenaires.

## 3. Catalogue complet des API endpoints

### 3.1 EDI Operations (CORE)

| Méthode | Route | Description | Détail |
|---------|-------|-------------|--------|
| POST | `/api/orders/eancom` | Génération & envoi ORDERS | Génère EANCOM + crée transmission |
| POST | `/api/orders/respond` | Génération ORDRSP | Réponse commande (accept/reject/modify) |
| POST | `/api/orders/accept-modifications` | ORDCHG | Accepter modifications |
| POST | `/api/edi/desadv/send` | Envoi DESADV | Avis d'expédition |
| POST | `/api/edi/invoic/send` | Envoi INVOIC | Facture |
| POST | `/api/edi/receive` | Réception EDI | Staging + parsing |

### 3.2 Orchestrateur (fichier séparé)

| Méthode | Route | Description |
|---------|-------|-------------|
| POST | `/api/orchestrator/relay` | Relais message chiffré |
| POST | `/api/orchestrator/register` | Enregistrement nœud |
| GET | `/api/orchestrator/discovery` | Annuaire réseau |
| GET | `/api/orchestrator/keys/:gln` | Clé publique nœud |
| POST | `/api/audit/sync` | Synchronisation logs P2P |

## 4. Module Crypto — Spécification

### 4.1 CryptoService.encryptAndSign(payload, recipientGLN)

**Algorithmes** :
- Chiffrement symétrique : **AES-256-GCM** (clé éphémère 32 bytes, IV 16 bytes)
- Chiffrement asymétrique : **RSA-2048-OAEP-SHA256** (clé publique destinataire)
- Signature : **RSA-SHA256** (clé privée locale)

**Étapes** :

<div class="not-prose my-6 bg-[#1e1e1e] rounded-xl overflow-hidden shadow-2xl font-mono text-[13px] border border-slate-700">
<div class="flex items-center px-4 py-2 bg-[#252526] border-b border-[#333]">
<div class="flex gap-1.5"><div class="w-3 h-3 rounded-full bg-slate-600"></div><div class="w-3 h-3 rounded-full bg-slate-600"></div><div class="w-3 h-3 rounded-full bg-slate-600"></div></div>
<div class="ml-4 text-slate-400 text-xs font-sans tracking-wide">CryptoService.js</div>
</div>
<div class="p-5 overflow-x-auto text-slate-300 leading-[1.8]">
<div class="text-slate-500 mb-4 italic">// Input: payload (Object), recipientGLN (string)</div>

<div><span class="text-blue-400">1.</span> <span class="text-blue-200">dataBuffer</span> = <span class="text-yellow-200">Buffer</span>(<span class="text-teal-300">JSON</span>.<span class="text-yellow-200">stringify</span>(payload))</div>
<div><span class="text-blue-400">2.</span> <span class="text-blue-200">aesKey</span> = <span class="text-blue-200">crypto</span>.<span class="text-yellow-200">randomBytes</span>(<span class="text-orange-300">32</span>)           <span class="text-green-600 italic ml-4">// Clé éphémère</span></div>
<div><span class="text-blue-400">3.</span> <span class="text-blue-200">iv</span> = <span class="text-blue-200">crypto</span>.<span class="text-yellow-200">randomBytes</span>(<span class="text-orange-300">16</span>)               <span class="text-green-600 italic ml-4">// Vecteur initialisation</span></div>
<div><span class="text-blue-400">4.</span> <span class="text-blue-200">cipher</span> = <span class="text-yellow-200">createCipheriv</span>(<span class="text-orange-200">'aes-256-gcm'</span>, aesKey, iv)</div>
<div><span class="text-blue-400">5.</span> <span class="text-blue-200">encryptedData</span> = cipher.<span class="text-yellow-200">update</span>(dataBuffer) + cipher.<span class="text-yellow-200">final</span>()</div>
<div><span class="text-blue-400">6.</span> <span class="text-blue-200">authTag</span> = cipher.<span class="text-yellow-200">getAuthTag</span>()             <span class="text-green-600 italic ml-4">// Tag authentification GCM</span></div>
<div><span class="text-blue-400">7.</span> <span class="text-blue-200">recipientPubKey</span> = <span class="text-purple-400">await</span> keyManager.<span class="text-yellow-200">getPublicKeyForGLN</span>(recipientGLN)</div>
<div><span class="text-blue-400">8.</span> <span class="text-blue-200">encryptedKey</span> = <span class="text-yellow-200">publicEncrypt</span>(RSA_OAEP_SHA256, recipientPubKey, aesKey)</div>
<div><span class="text-blue-400">9.</span> <span class="text-blue-200">myPrivateKey</span> = keyManager.<span class="text-yellow-200">getLocalPrivateKey</span>()</div>
<div><span class="text-blue-400">10.</span> <span class="text-blue-200">signature</span> = <span class="text-yellow-200">createSign</span>(<span class="text-orange-200">'SHA256'</span>).<span class="text-yellow-200">update</span>(dataBuffer).<span class="text-yellow-200">sign</span>(myPrivateKey)</div>

<div class="text-slate-500 mt-4 italic">// Output: { encryptedData, iv, tag, encryptedKey, signature }</div>
</div>
</div>

### 4.2 KeyManager — Résolution de clés

**`getPublicKeyForGLN(gln)`** — Async, 3 niveaux de résolution :

| Niveau | Source | Latence | Cache |
|--------|--------|---------|-------|
| 1 | `network_directory` (DB locale) | <1ms | Oui (persistant) |
| 2 | Orchestrateur `GET /keys/:gln` | ~100ms | Sauvegardé en DB |
| 3 | Fichier local `partners/<gln>.pem` | <1ms | Non (legacy) |

    <!-- Logic JS -->
    <script>
        // Setup Marked.js with Highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-',
            breaks: true,
            gfm: true
        });

        let activeObserver = null;
        let isProgrammaticScroll = false;

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function switchTab(partId) {
            // Update Buttons Styling
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-50', 'text-primary');
                btn.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            const activeBtn = document.getElementById(`tab-btn-${partId}`);
            activeBtn.classList.add('bg-indigo-50', 'text-primary');
            activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');

            // Render Markdown
            const mdContent = document.getElementById(`md-part${partId}`).value;
            const contentArea = document.getElementById('content-area');
            
            contentArea.style.opacity = 0;
            
            setTimeout(() => {
                contentArea.innerHTML = marked.parse(mdContent);
                contentArea.style.opacity = 1;
                
                // Process TOC & Observers
                buildTableOfContents(contentArea);
                document.getElementById('scroll-area').scrollTop = 0;
                
                // Close mobile menu
                if(window.innerWidth < 1024) toggleMobileMenu();
            }, 150);
        }

        function buildTableOfContents(container) {
            const tocList = document.getElementById('toc-list');
            tocList.innerHTML = '';
            
            if (activeObserver) activeObserver.disconnect();
            
            const headers = container.querySelectorAll('h2, h3');
            
            // Intersection Observer to highlight active section on scroll
            const observerOptions = {
                root: document.getElementById('scroll-area'),
                rootMargin: '-80px 0px -70% 0px',
                threshold: 0
            };

            activeObserver = new IntersectionObserver((entries) => {
                if (isProgrammaticScroll) return;
                
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
                        const activeLink = document.querySelector(`.toc-link[href="#${entry.target.id}"]`);
                        if (activeLink) activeLink.classList.add('active');
                    }
                });
            }, observerOptions);

            headers.forEach(header => {
                // Ensure ID exists
                if (!header.id) {
                    header.id = header.innerText.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                }

                // Create TOC Link
                const link = document.createElement('a');
                link.href = `#${header.id}`;
                link.textContent = header.innerText.replace(/^[\d\.]+\s*/, ''); // Clean numbers if preferred, leaving original text
                link.className = `toc-link block py-2 pl-4 border-l-[3px] border-transparent text-sm text-slate-500 hover:text-slate-800 transition-colors duration-200`;
                
                if (header.tagName.toLowerCase() === 'h3') {
                    link.classList.add('ml-3', 'text-[0.825rem]');
                }

                // Handle Clicks
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    isProgrammaticScroll = true;
                    
                    document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');

                    // Scroll element
                    const scrollArea = document.getElementById('scroll-area');
                    const targetPosition = header.offsetTop - 40; // Small offset for breathing room
                    
                    scrollArea.scrollTo({ top: targetPosition, behavior: 'smooth' });
                    
                    if(window.innerWidth < 1024) toggleMobileMenu();

                    // Re-enable observer after scroll animation
                    setTimeout(() => { isProgrammaticScroll = false; }, 800);
                });

                tocList.appendChild(link);
                activeObserver.observe(header);
            });
            
            // Highlight first element initially
            if(tocList.firstChild) tocList.firstChild.classList.add('active');
        }

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            switchTab(1);
        });
    </script>
