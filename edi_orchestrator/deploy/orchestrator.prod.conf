# ============================================================================
# 🌍 DÉPLOIEMENT — EDI Orchestrator (PAESN Registry) — PROD
# ----------------------------------------------------------------------------
# Consommé par deploy/deploy_orchestrator.sh.
# ⚠️  RENSEIGNER REMOTE_HOST + PUBLIC_URL avant tout déploiement PROD.
# Aucun secret ici (les secrets vivent dans le .env du serveur PROD,
# avec un JWT_SECRET DISTINCT de la DEV).
# ============================================================================

ENV_NAME="prod"

# --- Connexion SSH (serveur PROD — IP à fournir) ---
REMOTE_HOST="__A_RENSEIGNER__"          # ex: 51.xx.xx.xx
REMOTE_PORT="22"
REMOTE_USER="Consultant"

# --- Cible sur le serveur ---
REMOTE_DIR="/var/www/Edi-prod/edi_orchestrator"
LOG_DIR="/var/www/Edi-prod/logs"

# --- PM2 (nom + port distincts de la DEV pour cohabitation éventuelle) ---
PM2_APP_NAME="codeonline-edi-orchestrator-prod"
PM2_PORT=5012

# --- Base de données (ISOLÉE de la DEV) ---
DB_NAME="codeonline_edi_db_prod"

# --- Public / health ---
PUBLIC_URL="__A_RENSEIGNER__"           # ex: https://hub.codeonline-edi.net  ou  http://<IP_PROD>:5012
HEALTH_PATH="/api/tracking/health"
