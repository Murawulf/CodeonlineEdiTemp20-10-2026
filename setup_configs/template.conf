# ==============================================================================
# 📝 FICHIER DE CONFIGURATION MODÈLE POUR NOUVEAU DÉPLOIEMENT
# Copiez ce fichier (ex: setup_configs/cote_ivoire.conf) et remplissez les valeurs.
# ==============================================================================

# --- INFORMATIONS GÉNÉRALES ---
COUNTRY_NAME="Cote d'Ivoire"
COUNTRY_CODE="CI"  # Code ISO 2 lettres
INSTANCE_CODE="cote_ivoire" # Code unique pour l'application

# --- CONNEXION SSH (SERVEUR) ---
REMOTE_HOST="x.x.x.x"
REMOTE_PORT="22"
REMOTE_USER="root" # Utilisateur SSH (idéalement root pour l'installation initiale, ou sudoer)
REMOTE_ROOT="/var/www/Edi-dev" # Dossier d'installation sur le serveur

# --- BASE DE DONNÉES (MYSQL) ---
# L'utilisateur doit avoir les droits de créer des bases de données
DB_HOST="127.0.0.1"
DB_PORT="3306"
DB_ROOT_USER="root" # Utilisateur avec droits de création de DB
DB_ROOT_PASS="votre_password_root" 
DB_NAME="Dev_Entitedb"
DB_APP_USER="consultant_ci" # Nouvel utilisateur à créer pour l'app
DB_APP_PASS="password_secure_ci"

# --- APPLICATION ---
PM2_APP_NAME="codeonline-edi-ci"
PM2_PORT="5002"
API_PUBLIC_URL="http://x.x.x.x:5002"

# --- FICHIER SQL SOURCE ---
# Chemin vers le dump SQL de la structure (par défaut celui du projet)
SQL_DUMP_FILE="sql/backend/Dev_Entitedb.sql"
