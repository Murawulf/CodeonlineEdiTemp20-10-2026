# ==============================================================================
# 🌍 CONFIGURATION DÉPLOIEMENT : [NOM_DU_PAYS]
# Copiez ce fichier et remplissez les variables
# ==============================================================================

# --- INFORMATIONS GÉNÉRALES ---
COUNTRY_NAME="Exemple Pays"

# --- CONNEXION SSH (Serveur) ---
REMOTE_USER="Consultant"
REMOTE_HOST="91.134.35.126"
REMOTE_PORT="22"

# --- CIBLE SUR LE SERVEUR ---
# Dossier racine où l'application sera installée
# Exemple : /var/www/Edi-senegal
REMOTE_ROOT="/var/www/Edi-exemple"

# --- CONFIGURATION NODE.JS (PM2) ---
# Nom unique pour l'application dans PM2
PM2_APP_NAME="codeonline-edi-exemple"

# Port d'écoute Node.js (Doit être UNIQUE sur le serveur)
# Exemples : 5001 (Sénégal), 5002 (Cameroun), etc.
PM2_PORT=5002

# --- CONFIGURATION BASE DE DONNÉES ---
# Nom de la base de données MySQL pour ce pays
DB_NAME="Exemple_Entitedb"

# --- CONFIGURATION PUBLIQUE ---
# URL utilisée par le Frontend pour contacter l'API
# Doit correspondre à la configuration Apache (ProxyPass)
API_PUBLIC_URL="https://exemple.codeonline-edi.net"
